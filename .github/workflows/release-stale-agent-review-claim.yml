name: Release stale agent-review dispatcher claim

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-stale-agent-review-claim.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Prove and retire stale branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin
          state="$(python3 custodian/tools/agent/branch_hygiene.py agent/agent-review-pipeline | tail -n 1 | cut -f1)"
          if [[ "$state" != "LANDED_SAFE_DELETE" && "$state" != "IDENTICAL_SAFE_DELETE" ]]; then
            echo "Refusing cleanup: agent/agent-review-pipeline classified as $state" >&2
            exit 2
          fi

          python3 custodian/tools/agent/branch_hygiene.py \
            --apply \
            --note "Released stale dispatcher claim; branch had no unique commits and blocked the review-pipeline queue." \
            agent/agent-review-pipeline

      - name: Remove one-time cleanup surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("custodian/tools/validation/validation_manifest.json")
          data = json.loads(manifest_path.read_text())
          owner = ".github/workflows/release-stale-agent-review-claim.yml"
          for test in data.get("tests", []):
              owners = test.get("owners")
              if isinstance(owners, list) and owner in owners:
                  test["owners"] = [value for value in owners if value != owner]
          manifest_path.write_text(json.dumps(data, indent=2) + "\n")
          PY

          rm -f .github/workflows/release-stale-agent-review-claim.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custodian/docs/ai_context/BRANCH_ARCHIVE.md \
                  custodian/tools/validation/validation_manifest.json \
                  .github/workflows/release-stale-agent-review-claim.yml
          git commit -m "agent dispatch, release stale review claim"
          git pull --rebase origin main
          git push origin HEAD:main

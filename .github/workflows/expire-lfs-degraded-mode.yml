name: Expire temporary Git LFS degraded mode

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Checkout repository without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Remove expired LFS degraded-mode guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          expiry = datetime(2026, 10, 1, 4, 0, tzinfo=timezone.utc)
          if datetime.now(timezone.utc) < expiry:
              print("LFS degraded mode has not expired yet.")
              raise SystemExit(0)

          targets = [
              (
                  Path("custodian/AGENTS.md"),
                  "<!-- TEMP_LFS_DEGRADED_MODE_START",
                  "<!-- TEMP_LFS_DEGRADED_MODE_END -->",
              ),
              (
                  Path("custodian/tools/agent/workstream.py"),
                  "# TEMP_LFS_DEGRADED_MODE_START",
                  "# TEMP_LFS_DEGRADED_MODE_END",
              ),
              (
                  Path("custodian/tools/agent/land_main.py"),
                  "# TEMP_LFS_DEGRADED_MODE_START",
                  "# TEMP_LFS_DEGRADED_MODE_END",
              ),
              (
                  Path("tools/custodian_aliases.sh"),
                  "# TEMP_LFS_DEGRADED_MODE_START",
                  "# TEMP_LFS_DEGRADED_MODE_END",
              ),
          ]

          def remove_block(path: Path, start_marker: str, end_marker: str) -> bool:
              text = path.read_text()
              start = text.find(start_marker)
              if start < 0:
                  return False
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"missing end marker in {path}")
              end += len(end_marker)
              before = text[:start].rstrip()
              after = text[end:].lstrip("\n")
              path.write_text(before + "\n\n" + after)
              return True

          changed = False
          for path, start_marker, end_marker in targets:
              changed = remove_block(path, start_marker, end_marker) or changed

          workflow = Path(".github/workflows/expire-lfs-degraded-mode.yml")
          if workflow.exists():
              workflow.unlink()
              changed = True

          print("Expired temporary LFS degraded mode." if changed else "Nothing to expire.")
          PY

          if git diff --quiet --exit-code; then
            echo "No expired temporary state found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custodian/AGENTS.md \
                  custodian/tools/agent/workstream.py \
                  custodian/tools/agent/land_main.py \
                  tools/custodian_aliases.sh \
                  .github/workflows/expire-lfs-degraded-mode.yml
          git commit -m "git lfs, expire degraded mode"
          git push origin HEAD:main